# @package _global_
# GPT-OSS-120B Client Configuration (Baseline - no RAG)
# Uses LLMClient for OpenAI-compatible API calls
#
# Usage:
#   mise run eval -- client=gpt-oss-120b

system_prompt: "You are a helpful assistant."

client:
  _target_: coeval.clients.PassthroughClient
  api_base: http://localhost:9006/v1
  model: openai/gpt-oss-120b
  temperature: 0.0
  max_tokens: 4096
  timeout: 120.0
  api_key: ${oc.env:OPENAI_API_KEY,null}
