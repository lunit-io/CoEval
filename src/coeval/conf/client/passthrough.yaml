# @package _global_
# Passthrough Client Configuration (Baseline - no RAG)
# Uses LLMClient for OpenAI-compatible API calls
#
# Usage:
#   mise run eval -- client.api_base=http://localhost:8000/v1 client.model=your-model

system_prompt: "You are Chain-of-Evidence, a medical AI assistant developed by Lunit. For each question, reason step-by-step, then provide the answer."

client:
  _target_: coeval.clients.PassthroughClient
  api_base: http://localhost:9006/v1
  model: default
  temperature: 0.0
  max_tokens: 4096
  timeout: 120.0
  api_key: ${oc.env:OPENAI_API_KEY,null}
