# @package _global_
#
# Conquer Health TEST split — decides the final ranking.
#
# Held out. `ids_path` is mandatory and must point OUTSIDE this repository:
# every HealthBench prompt and rubric is public, so the only thing protecting
# this set is which items were chosen. Committing the id list here would leak it.
#
# The split generator is public too, so it takes a mandatory high-entropy --salt;
# without one the selection is a pure function of the sizes quoted below and this
# repository would contain the holdout. The salt lives beside the test id list on
# internal shared storage; neither belongs in git, and the location is
# communicated to run operators out of band.
#
# The split is nested: val is a prefix of a per-theme balanced ordering and test
# is the slice after it, so val does not move when the test size changes, and
# test(500) is a subset of test(1000). Val can therefore be frozen and published
# while the test size is still open, and the test size can be settled at scoring
# time against measured capacity by re-running the generator with the same salt.
#
# 500 examples / 5,690 judge calls per submission. Re-measured on the final
# hackathon fleets (L1 8x tp=1 behind a cache_aware router; DeepSeek 9 workers;
# GLM 6 workers), at 20 parallel submissions:
#
#   generation  10,000 completions @ 6.75 req/s  = 25 min
#   judging    113,800 calls      @ 41.4 req/s   = 46 min
#   overlapped (different hardware)              ~46 min, judge-bound
#
# n=1000 does not fit the 1.5h window: judging alone is 92 min. Adding judge
# workers does not help, because the ceiling below is a router admission limit
# rather than a capacity one -- it did not move when the fleet went to 9 workers.
#
# Run-to-run noise is sd 0.011 at this size (measured 0.017 at n=200, scaled by
# 1/sqrt(n)), so teams within ~3 points are a statistical tie. Rank with a
# bootstrap CI over the common successfully-graded item set, and pre-declare the
# tiebreak before results exist.
#
#   uv run coeval datasets=conquer_test \
#     datasets/metrics/judge@conquer_judge=<judge> \
#     '++datasets.conquer_test.ids_path=<held-out-dir>/conquer_test_ids.json' \
#     client.llm.config.api_base=http://<team-container>:8000/v1 \
#     client.llm.config.model=team-chatbot

# The judge is mandatory and deliberately unset. Naming it here would publish
# which model decides the award, and teams can tune answers to a known grader --
# the grader template itself is public, so that tuning is cheap and effective.
# Supply it at scoring time alongside ids_path:
#   datasets/metrics/judge@conquer_judge=<judge>
defaults:
  - metrics/judge@conquer_judge: ???

datasets:
  conquer_test:
    _target_: coeval.datasets.conquer.ConquerHealthTestDataset
    ids_path: ???        # no default on purpose — see header
    num_samples: ${num_samples}
    system_prompt: ${system_prompt}

metrics:
  conquer_test:
    healthbench_rubric:
      _target_: coeval.metrics.healthbench_rubric.HealthBenchRubricMetric
      # 20 submissions x 12 = 240, just under the measured 256 judge ceiling.
      # This number is only correct for ~20-way parallelism. A solo run wants
      # 64; a 40-way run wants 6. See the note below on enforcing it centrally.
      concurrent_limit: 12
      max_attempts: 4
      retry_delay_s: 2.0
      judge: ${conquer_judge}

score_aggregators:
  conquer_test:
    _target_: coeval.util.aggregation.clipped_avg_aggregator
    _partial_: true

runner:
  # 20 x 12 = 240 aggregate, validated the way it will actually be used: 20
  # independent clients, each with its own system prompt and its own retrieved
  # passages, so no prefix is shared between teams. Both routers run
  # --policy cache_aware, and a single-client benchmark sharing one prompt
  # prefix flatters that policy in a way 20 real teams will not.
  #
  # Measured under those conditions with 4k tokens of RAG context: aggregate 240
  # gives 6.75 req/s with zero failures, aggregate 120 gives 5.20 req/s. Slowest
  # team ran 1.6x behind the fastest, so no starvation. Bare-prompt single-client
  # runs shed above ~256 (252 of 768 rejected at C=512), so 240 sits under the
  # ceiling with margin -- worth keeping, since shedding drops examples and
  # dropped examples differ per team, which breaks the comparison.
  concurrent_limit: 12
  # Two attempts, not three: retrying a 180s timeout three times burns 9 minutes
  # on a single stuck item. A per-submission wall-clock budget is the backstop.
  inference_max_attempts: 2
  inference_retry_delay_s: 2.0
  # A team whose endpoint errors or returns an empty answer must score 0, not
  # have those items dropped from its denominator. Dropping rewards failing
  # loudly over answering badly, and leaves each team averaged over a different
  # item set. Judge-side failures stay excluded -- those are ours, not theirs.
  score_inference_failures_as_zero: true

client:
  llm:
    config:
      max_tokens: 6144
      timeout: 180.0
