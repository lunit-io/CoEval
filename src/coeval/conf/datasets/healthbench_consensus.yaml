# @package _global_
#
# Standalone HealthBench Consensus config — dataset, metric, judge, aggregator.
#
# Use the official clipped-average formula shared with HealthBench Main.
#
# Judge model swap (shared config group: conf/datasets/metrics/judge/):
#   mise run eval -- datasets=healthbench_consensus datasets/metrics/judge@healthbench_judge=gpt-4.1

defaults:
  - metrics/judge@healthbench_judge: gpt-4.1

datasets:
  healthbench_consensus:
    _target_: coeval.datasets.healthbench.HealthBenchConsensusDataset
    num_samples: ${num_samples}
    system_prompt: ${system_prompt}

metrics:
  healthbench_consensus:
    healthbench_rubric:
      _target_: coeval.metrics.healthbench_rubric.HealthBenchRubricMetric
      concurrent_limit: 10
      max_attempts: 3
      retry_delay_s: 1.0
      judge: ${healthbench_judge}

score_aggregators:
  healthbench_consensus:
    _target_: coeval.util.aggregation.clipped_avg_aggregator
    _partial_: true
