# Rubric grading emits a short JSON verdict: measured 91 completion tokens
# (mean, n=2944 calls). max_tokens is not free even when unused -- vLLM reserves
# KV by it, and 2048 -> 4096 cost 20% throughput in measurement, so keep it tight.
# temperature stays >0 deliberately: this model degenerates into repetition loops
# at greedy decode. The cost is run-to-run score noise (sd 0.017 at n=200); the
# mitigation is set size plus a multi-vote runoff, not temperature.
_target_: coeval.clients.PassthroughJudge
config:
  _target_: coeval.llm.config.LLMConfig
  _convert_: all
  api_base: http://shared-cluster-vm-026:5500/v1
  model: glm-5.2-fp8
  api_key: local-no-auth
  temperature: 1.0
  # 1024 is the optimum on both axes, measured at concurrency 120 over 480 real
  # rubric items (usable = replies parse_grading_response accepts, which is what
  # the metric actually consumes):
  #   512  -> 11.0 usable call/s, 5.2% truncated mid-JSON and retried into a
  #           scoring failure. A truncated reply also burns the whole budget.
  #   1024 -> 12.2 usable call/s, 0.2% truncated.
  #   2048 -> 8.1 usable call/s. This is the KV-reservation cost noted above.
  max_tokens: 1024
  timeout: 120
  max_retries: 0
  additional_kwargs:
    top_p: 1.0
    seed: 42
