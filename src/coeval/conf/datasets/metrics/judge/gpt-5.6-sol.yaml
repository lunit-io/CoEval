# Judge: gpt-5.6-sol via OpenAI API, or any OpenAI-compatible endpoint via OPENAI_API_BASE.
#
# Concrete model id on purpose — the `gpt-5.6` alias is not in llama-index's
# O1_MODELS registry, so OpenAILike would not apply the reasoning-model handling.
#
# Usage:
#   mise run eval -- datasets=healthbench_main \
#     datasets/metrics/judge@healthbench_judge=gpt-5.6-sol
_target_: coeval.clients.PassthroughJudge
config:
  _target_: coeval.llm.config.LLMConfig
  _convert_: all
  api_base: ${oc.env:OPENAI_API_BASE,https://api.openai.com/v1}
  model: gpt-5.6-sol
  api_key: ${oc.env:OPENAI_API_KEY}
  temperature: 0.0
  max_tokens: 8192
