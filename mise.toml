[settings]
python.uv_venv_auto = true

[env]
DEEPEVAL_DISABLE_TIMEOUTS = "True"
DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE = "600"
DEEPEVAL_TELEMETRY_OPT_OUT = "YES"
DEEPEVAL_LOG_LEVEL = "WARNING"
# HealthBench grading (OpenAI gpt-4.1)
# OPENAI_API_KEY = "sk-your-api-key-here"
# OPENAI_API_BASE = "https://api.openai.com/v1"

[tools]
python = "3.13.1"

# CI-required tasks
[tasks.sync]
description = "Sync dependencies"
run = "uv sync --dev"

[tasks.test]
description = "Run unit tests (excluding integration)"
run = "uv run pytest tests/unit -v --tb=short --color=yes -m \"not integration\""

[tasks.lock]
description = "Lock dependencies"
run = "uv lock"

# Local development tasks
[tasks."test:all"]
run = "uv run pytest tests/ -v --tb=short --color=yes"

[tasks.lint]
run = "uv run ruff check src/ tests/"

[tasks.format]
run = "uv run ruff format src/ tests/"

# Evaluation tasks
[tasks.eval]
description = "Run evaluation (pass Hydra overrides as args)"
run = "uv run coeval"
