[project]
name = "coeval"
version = "0.1.0"
license = "Apache-2.0"
description = "CoEval - Chain-of-Evidence Evaluation Framework for Medical LLM Benchmarks"
readme = "README.md"
authors = [
    { name = "Mingu Kang", email = "jeffkang@lunit.io" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    # Core dependencies
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # LLM client
    "llama-index-llms-openai-like>=0.3.0",
    "httpx>=0.27.0",
    # Evaluation
    "datasets>=3.0.0",
    "deepeval>=3.7.7",
    "rich>=13.0.0",
    "scikit-learn>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coeval"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
coeval = "coeval.main:main"

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["coeval"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "-ra"]
asyncio_mode = "auto"
